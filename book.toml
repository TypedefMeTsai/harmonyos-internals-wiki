[book]
title = "鸿蒙技术内幕：系统架构、性能优化与工具实战"
description = "一本面向有经验的鸿蒙（HarmonyOS）开发者与系统工程师的技术百科（English: HarmonyOS Internals: System Architecture, Performance & Tooling in Practice）"
authors = []
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/"
no-section-label = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-hierarchical-headings = true
heading-split-level = 2
